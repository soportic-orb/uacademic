  <head>
    <meta charset="UTF-8" />
    <title>UAcademic</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Microsoft returns here, and nothing else happens: the window that opened
      this one reads the response out of the address bar and closes it.

      It is deliberately not the application. Pointing the redirect at the site
      root boots the whole SPA inside the pop-up — a white window while React,
      the translations and the service worker load, in a window the user is
      supposed to see for a fraction of a second — and the pop-up can be closed
      out from under a half-started app.
    -->
  </body>
</html>
