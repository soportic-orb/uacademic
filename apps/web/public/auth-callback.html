    <!--
      Microsoft returns here. Normally nothing happens: the window that opened
      this one reads the response out of the address bar and closes it before
      anybody reads the line below — which is there for the other arrival, an
      administrator coming back from granting consent in their own tenant.

      It is deliberately not the application. Pointing the redirect at the site
      root boots the whole SPA inside the pop-up — a white window while React,
      the translations and the service worker load — and a service-worker
      update waiting there reloads the window and throws the response away.
    -->
